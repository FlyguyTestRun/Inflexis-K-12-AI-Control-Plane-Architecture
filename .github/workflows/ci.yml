name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  security-gates:
    # These gates fail the build rather than warn. An authorization regression
    # that only produces a warning is an authorization regression that ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Authorization boundary tests
        run: pytest tests/security -q
      - name: Gold set (leakage is a release blocker)
        run: pytest tests/governance/test_evaluation.py -q
      - name: Repository hygiene checks
        run: python scripts/check_repository_hygiene.py

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON documents parse
        run: python scripts/validate_json.py
      - name: Check internal documentation links
        run: python scripts/check_doc_links.py
